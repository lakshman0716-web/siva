<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan History & Predictions - AgriVision AI</title>
  <meta name="description" content="Chronological log of AI plant leaf pathology scans and predictions persisted to the AgriVision SQLite database.">
  <link rel="stylesheet" href="styles.css?v=2.1">
</head>
<body>
  <div class="app-container">
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open Navigation">☰</button>
          <h1 class="topbar-title">Reports</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search-box">
            <span class="topbar-search-icon">🔍</span>
            <input type="text" class="topbar-search-input" id="global-search" placeholder="Search" aria-label="Search crops and diseases">
          </div>
          <button class="topbar-bell-btn" id="topbar-bell-btn" title="View 3 Alerts" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="bell-badge-count">3</span>
          </button>
          <div class="topbar-profile" id="topbar-profile" title="Sivaiah Aradyulu - AgriTech Lead & Agronomist">
            <img src="assets/sivaiah-aradyulu.jpg" alt="Sivaiah Aradyulu" class="topbar-avatar-img">
            <span class="topbar-profile-name">Sivaiah Aradyulu</span>
            <span class="topbar-chevron">▾</span>
          </div>
        </div>
      </header>
      
      <div class="page-content animate-fade-in">
        
        <div class="card mb-6" style="padding: 22px 24px;">
          <div class="history-header" style="margin-bottom: 0;">
            <div>
              <div class="section-pill" style="margin-bottom: 6px;">Pathology Log</div>
              <h2 style="font-size: 1.4rem; color: var(--deep-forest-green); margin: 0 0 4px;">Diagnostic Archive</h2>
              <p class="text-grey" style="font-size: 0.9rem; margin: 0;">Filter predictions by health status or risk urgency index.</p>
            </div>
            <div class="filters" id="filters-container">
              <button class="filter-btn active" data-filter="all">All Scans</button>
              <button class="filter-btn" data-filter="healthy">Healthy Only</button>
              <button class="filter-btn" data-filter="disease">Pathology Detected</button>
              <button class="filter-btn" data-filter="high-risk">High Risk Alert</button>
            </div>
          </div>
        </div>
        
        <div class="history-grid" id="history-grid">
          <!-- Populated by JS -->
        </div>
        
        <!-- Empty State (Hidden by default) -->
        <div id="empty-state" style="display: none; text-align: center; padding: 64px 24px; background: var(--white); border-radius: var(--radius-lg); border: 1px dashed var(--border-color); box-shadow: var(--shadow-sm);">
           <div style="font-size: 52px; margin-bottom: 16px;">🌱</div>
           <h3 class="mb-2" style="font-size: 1.35rem; color: var(--deep-forest-green);">No scans match this filter.</h3>
           <p class="text-grey mb-6">Scan plant leaves using the AI scanner to log new diagnostic records into SQLite.</p>
           <a href="scanner.html" class="btn btn-primary">Scan Your First Plant</a>
        </div>

      </div>
    </main>
  </div>

  <script src="data.js?v=2.1"></script>
  <script src="app.js?v=2.1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const historyGrid = document.getElementById('history-grid');
      const emptyState = document.getElementById('empty-state');
      
      // Load scans from database bridge
      let allScans = [];
      try {
        allScans = await window.AgriDB.getHistory();
      } catch (err) {
        allScans = APP_DATA.history;
      }
      
      const getPlantEmoji = (crop) => {
        if (!crop) return '🪴';
        const c = crop.toLowerCase();
        if (c.includes('tomato')) return '🍅';
        if (c.includes('potato')) return '🥔';
        if (c.includes('chilli') || c.includes('pepper')) return '🌶️';
        if (c.includes('rice')) return '🌾';
        if (c.includes('corn') || c.includes('maize')) return '🌽';
        if (c.includes('apple')) return '🍎';
        if (c.includes('grape')) return '🍇';
        if (c.includes('straw')) return '🍓';
        return '🪴';
      };

      function renderScans(items) {
        historyGrid.innerHTML = '';
        
        if (!items || items.length === 0) {
          emptyState.style.display = 'block';
          return;
        }
        emptyState.style.display = 'none';

        items.forEach((item, index) => {
          const diseaseName = item.disease || item.result || 'Unknown';
          const cropName = item.crop || item.plant || 'Crop';
          const scanUid = item.scan_uid || `SCAN-2026-0${100 + index}`;
          const severity = item.severity || 'Moderate';
          const risk = item.risk || severity;
          const confidence = item.confidence || 90;
          const dateStr = item.date || 'Recent';

          let badgeClass = 'badge-success';
          if (severity === 'Moderate' || risk === 'Moderate') badgeClass = 'badge-warning';
          if (severity === 'Severe' || severity === 'High' || risk === 'High') badgeClass = 'badge-danger';
          
          const isHealthy = diseaseName.toLowerCase().includes('healthy');
          const statusIcon = isHealthy ? '✅' : '⚠️';

          const cardId = `scan-${item.id || index}`;

          let imgUrl = item.image_url || item.image || '';
          if (!imgUrl || imgUrl.includes('samples/')) {
            const dLow = (diseaseName || '').toLowerCase();
            if (dLow.includes('early blight')) imgUrl = 'assets/diseases/early-blight.jpg';
            else if (dLow.includes('late blight')) imgUrl = 'assets/diseases/late-blight.jpg';
            else if (dLow.includes('mildew')) imgUrl = 'assets/diseases/powdery-mildew.jpg';
            else if (dLow.includes('wilt')) imgUrl = 'assets/diseases/bacterial-wilt.jpg';
            else if (dLow.includes('rust')) imgUrl = 'assets/diseases/corn-rust.jpg';
            else if (dLow.includes('spot')) imgUrl = 'assets/diseases/leaf-spot.jpg';
            else if (dLow.includes('scab')) imgUrl = 'assets/diseases/apple-scab.jpg';
            else if (dLow.includes('blast')) imgUrl = 'assets/diseases/rice-blast.jpg';
            else if (dLow.includes('curl')) imgUrl = 'assets/diseases/tomato-leaf-curl.jpg';
            else imgUrl = 'assets/diseases/healthy.jpg';
          }

          historyGrid.innerHTML += `
            <div class="history-card">
              <div class="history-card-top">
                <div style="display: flex; align-items: center; gap: 12px;">
                  <img src="${imgUrl}" alt="${cropName} ${diseaseName}" class="history-img-thumb" onerror="this.onerror=null; this.src='assets/diseases/healthy.jpg';">
                  <div>
                    <div style="font-weight: 700; font-size: 0.95rem; color: var(--deep-forest-green); display: flex; align-items: center; gap: 6px;">
                      <span>${getPlantEmoji(cropName)}</span>
                      <span>${cropName}</span>
                    </div>
                    <div class="history-uid">${scanUid}</div>
                  </div>
                </div>
                <span class="badge ${badgeClass}" style="font-size: 0.75rem;">${risk}</span>
              </div>
              
              <div class="history-content">
                <div class="history-meta">
                  <span>📅 ${dateStr}</span>
                  <span>AI Certainty: <strong>${confidence}%</strong></span>
                </div>
                
                <div class="history-result">
                  <span style="color: ${isHealthy ? '#059669' : '#B91C1C'};">${statusIcon} ${diseaseName}</span>
                </div>
                
                <p style="color: var(--grey-text); font-size: 0.85rem; line-height: 1.45; margin-bottom: 16px; flex: 1;">
                  ${item.summary || `VGG19 CNN algorithm processed the leaf symptoms with a ${confidence}% certainty matching the diagnostic profile of ${diseaseName}.`}
                </p>

                <div style="padding-top: 14px; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                   <a href="diseases.html?search=${encodeURIComponent(diseaseName)}" style="color: var(--agriculture-green); font-size: 0.85rem; font-weight: 700; text-decoration: underline;">
                     View IPM Protocol →
                   </a>
                   <button onclick="toggleDetails('${cardId}')" id="btn-${cardId}" class="btn btn-outline btn-sm">
                     Details
                   </button>
                </div>

                <div id="details-${cardId}" style="display: none; margin-top: 12px; padding: 14px; background: var(--light-grey); border-radius: var(--radius-md); font-size: 0.82rem; border: 1px solid var(--border-color);">
                  <div style="font-weight: 700; margin-bottom: 6px; color: var(--deep-forest-green);">SQLite Record Metadata</div>
                  <div style="margin-bottom: 2px;"><strong>Pathology standard:</strong> PlantVillage / EPPO Global Database</div>
                  <div style="margin-bottom: 2px;"><strong>Storage table:</strong> predictions (id: ${item.id || index})</div>
                  <div><strong>Clinical status:</strong> Synchronized & Verified</div>
                </div>
              </div>
            </div>
          `;
        });
      }

      window.toggleDetails = function(id) {
        const div = document.getElementById(`details-${id}`);
        const btn = document.getElementById(`btn-${id}`);
        if (div.style.display === 'none') {
          div.style.display = 'block';
          btn.textContent = 'Hide Details';
        } else {
          div.style.display = 'none';
          btn.textContent = 'Details';
        }
      };

      // Initial Render
      renderScans(allScans);

      // Real-time synchronization when new scans are saved
      const refreshHistory = async () => {
        try {
          allScans = await window.AgriDB.getHistory();
          const activeFilter = document.querySelector('.filter-btn.active');
          const type = activeFilter ? activeFilter.dataset.filter : 'all';
          if (type === 'all') {
            renderScans(allScans);
          } else if (type === 'healthy') {
            renderScans(allScans.filter(s => (s.disease || s.result || '').toLowerCase().includes('healthy')));
          } else if (type === 'high-risk') {
            renderScans(allScans.filter(s => {
              const r = (s.risk || s.severity || '').toLowerCase();
              return r.includes('high') || r.includes('severe');
            }));
          } else if (type === 'disease') {
            renderScans(allScans.filter(s => !(s.disease || s.result || '').toLowerCase().includes('healthy')));
          }
        } catch (err) {
          console.warn("Could not refresh history:", err);
        }
      };

      window.addEventListener('agrivision:scan_saved', refreshHistory);
      window.addEventListener('storage', refreshHistory);

      // Filtering Logic
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          const type = btn.dataset.filter;
          if (type === 'all') {
            renderScans(allScans);
          } else if (type === 'healthy') {
            renderScans(allScans.filter(s => (s.disease || s.result || '').toLowerCase().includes('healthy')));
          } else if (type === 'high-risk') {
            renderScans(allScans.filter(s => {
              const r = (s.risk || s.severity || '').toLowerCase();
              return r.includes('high') || r.includes('severe');
            }));
          } else if (type === 'disease') {
            renderScans(allScans.filter(s => !(s.disease || s.result || '').toLowerCase().includes('healthy')));
          }
        });
      });
    });
  </script>
</body>
</html>
